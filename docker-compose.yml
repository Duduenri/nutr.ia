services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: nutri
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutri"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nutri:${POSTGRES_PASSWORD}@db:5432/nutri
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      INVITE_CODE: ${INVITE_CODE:?defina INVITE_CODE no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:?defina COOKIE_SECURE no .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?defina OPENAI_API_KEY no .env}
      OPENAI_MODEL: ${OPENAI_MODEL:?defina OPENAI_MODEL no .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?defina VAPID_PUBLIC_KEY no .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?defina VAPID_PRIVATE_KEY no .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?defina VAPID_SUBJECT no .env}
      UPLOAD_DIR: /data/uploads
      PORT: "3300"
    volumes:
      - uploads:/data/uploads

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:?defina WEB_PORT no .env}:80"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  uploads:
  caddy-data:
